<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RFM69 Telemetry Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#050506;
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;
      font-family:'Courier New',Courier,monospace;
    }
    .cluster{
      background:#080809;
      border:0.5px solid #1e1e22;
      border-radius:20px;
      padding:1.75rem 1.5rem 1.25rem;
      width:500px;
      box-shadow:0 0 60px #00000099;
    }
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
    .cluster-title{font-size:11px;letter-spacing:.14em;color:#444;text-transform:uppercase;}
    .rssi-pill{font-size:11px;color:#555;background:#101012;border:.5px solid #222226;border-radius:4px;padding:2px 10px;}

    /* Gauge area: canvas + absolutely positioned indicator nodes */
    .gauge-area{
      position:relative;
      width:460px;
      height:460px;
      margin:0 auto 1rem;
    }
    .gauge-area canvas{position:absolute;top:0;left:0;}

    /* Indicator node */
    .ind-node{
      position:absolute;
      width:62px;
      height:66px;
      transform:translate(-50%,-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:0px;
      background:#141416;
      border:1px solid #252528;
      border-radius:10px;
      padding:5px 4px 4px;
      transition:background .35s,border-color .35s,box-shadow .35s;
    }
    .ind-node.ok{
      background:#0d2e1f;
      border-color:#1a6644;
      box-shadow:0 0 10px #2dcf8a33;
    }
    .ind-node.fault{
      background:#2e0d0d;
      border-color:#882222;
      box-shadow:0 0 10px #ff4f4f33;
    }

    /* LED dot */
    .ind-led{
      width:8px;height:8px;
      border-radius:50%;
      background:#252528;
      border:1px solid #333;
      flex-shrink:0;
      margin-bottom:3px;
      transition:background .35s,box-shadow .35s;
    }
    .ind-node.ok   .ind-led{background:#2dcf8a;box-shadow:0 0 6px #2dcf8aaa;border-color:#1a6644;}
    .ind-node.fault .ind-led{background:#ff4f4f;box-shadow:0 0 6px #ff4f4faa;border-color:#882222;}

    /* FA icon */
    .ind-icon{
      font-size:18px;
      color:#2a2a2e;
      line-height:1;
      margin-bottom:3px;
      transition:color .35s;
    }
    .ind-node.ok    .ind-icon{color:#2dcf8a;}
    .ind-node.fault .ind-icon{color:#ff4f4f;}

    /* label */
    .ind-label{
      font-size:7.5px;
      letter-spacing:.07em;
      text-transform:uppercase;
      color:#444;
      text-align:center;
      line-height:1.2;
      transition:color .35s;
    }
    .ind-node.ok    .ind-label{color:#2dcf8a;}
    .ind-node.fault .ind-label{color:#ff4f4f;}

    /* Bottom controls */
    .bottom-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
    .btn-row{display:flex;gap:6px;}
    .dbtn{
      font-size:11px;font-family:'Courier New',monospace;
      padding:5px 13px;border-radius:5px;
      border:.5px solid #222226;background:#111113;color:#666;
      cursor:pointer;transition:background .2s,color .2s;
    }
    .dbtn:hover{background:#1a1a1e;color:#aaa;}
    .dbtn.live{border-color:#1a6644;color:#2dcf8a;}
    .conn-row{font-size:11px;color:#333;display:flex;align-items:center;gap:6px;}
    .dot{width:6px;height:6px;border-radius:50%;background:#222;flex-shrink:0;}
    .dot.live{background:#2dcf8a;animation:blink 1.4s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .pkt-count{font-size:10px;color:#333;}

    .log-area{
      background:#0a0a0c;border:.5px solid #181820;
      border-radius:6px;padding:.5rem .75rem;
      height:88px;overflow-y:auto;
    }
    .log-area::-webkit-scrollbar{width:4px;}
    .log-area::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}
    .log-line{font-size:10px;line-height:1.85;color:#333;}
    .log-line.ok{color:#2dcf8a;}
    .log-line.fault{color:#ff4f4f;}
    .log-line.sys{color:#444;}
    .footer{margin-top:.6rem;font-size:9px;color:#2a2a2e;text-align:center;letter-spacing:.06em;}
  </style>
</head>
<body>
<div class="cluster">
  <div class="top-bar">
    <span class="cluster-title">RFM69 · 915 MHz</span>
    <span class="rssi-pill" id="rssi">RSSI —</span>
  </div>

  <div class="gauge-area" id="gauge-area">
    <canvas id="gauge" width="460" height="460"></canvas>
    <!-- indicator nodes injected by JS -->
  </div>

  <div class="bottom-bar">
    <div class="btn-row">
      <button class="dbtn" id="conn-btn" onclick="connectSerial()">Connect serial</button>
      <button class="dbtn" id="demo-btn" onclick="toggleDemo()">Demo</button>
    </div>
    <div class="conn-row"><span class="dot" id="dot"></span><span id="cstat">disconnected</span></div>
    <span class="pkt-count" id="pkt">0 pkts</span>
  </div>

  <div class="log-area" id="log"></div>
  <div class="footer">open in chrome or edge &nbsp;·&nbsp; baud 115200 &nbsp;·&nbsp; web serial api</div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────
const SIGNALS = ["VSB_STATUS","CANWD_STATUS","RADIO_STATUS","IMD_STATUS","AMS_STATUS"];
const state   = {VSB_STATUS:"unknown",CANWD_STATUS:"unknown",RADIO_STATUS:"unknown",IMD_STATUS:"unknown",AMS_STATUS:"unknown"};

// 6 indicators around the gauge. TSSI is derived.
const INDICATORS = [
  {key:"VSB_STATUS",   label:"VSB",   iconClass:"fa-regular fa-circle-play"},
  {key:"CANWD_STATUS", label:"CAN",   iconClass:"fa-solid fa-dog"},
  {key:"RADIO_STATUS", label:"RADIO", iconClass:"fa-solid  fa-radio"},
  {key:"IMD_STATUS",   label:"IMD",   iconClass:"fa-solid  fa-bolt-lightning"},
  {key:"AMS_STATUS",   label:"AMS",   iconClass:"fa-solid  fa-car-battery"},
  {key:"TSSI",         label:"TSSI",  iconClass:"fa-regular fa-lightbulb"},
];

// ── Geometry ──────────────────────────────────────────────────────
const W=460, H=460, CX=230, CY=230;
const GAUGE_R  = 140;  // main arc
const NODE_R   = 196;  // distance from centre to indicator node centre
const START_DEG = 130, END_DEG = 410;
const SPAN_DEG  = END_DEG - START_DEG;

function deg2rad(d){return d*Math.PI/180;}
function indAngle(i){return deg2rad(START_DEG + (i/(INDICATORS.length-1))*SPAN_DEG);}

// ── Build indicator HTML nodes ────────────────────────────────────
function buildNodes(){
  const area = document.getElementById("gauge-area");
  INDICATORS.forEach((ind,i)=>{
    const ang = indAngle(i);
    const px  = CX + NODE_R*Math.cos(ang);
    const py  = CY + NODE_R*Math.sin(ang);

    const node = document.createElement("div");
    node.className = "ind-node";
    node.id = "node-"+ind.key;
    node.style.left = px+"px";
    node.style.top  = py+"px";

    node.innerHTML = `
      <div class="ind-led" id="led-${ind.key}"></div>
      <i class="ind-icon ${ind.iconClass}" id="icon-${ind.key}"></i>
      <div class="ind-label" id="label-${ind.key}">${ind.label}</div>
    `;
    area.appendChild(node);
  });
}

// ── Canvas gauge (arcs, ticks, centre, needles) ───────────────────
function drawGauge(){
  const canvas = document.getElementById("gauge");
  const ctx    = canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);

  // Outer bezel
  ctx.beginPath(); ctx.arc(CX,CY,GAUGE_R+20,0,Math.PI*2);
  ctx.fillStyle="#101012"; ctx.fill();
  ctx.strokeStyle="#252528"; ctx.lineWidth=1; ctx.stroke();

  // Face
  ctx.beginPath(); ctx.arc(CX,CY,GAUGE_R+7,0,Math.PI*2);
  ctx.fillStyle="#0c0c0e"; ctx.fill();

  // Background arc track
  const s0=deg2rad(START_DEG), s1=deg2rad(END_DEG);
  ctx.beginPath(); ctx.arc(CX,CY,GAUGE_R,s0,s1);
  ctx.strokeStyle="#1c1c20"; ctx.lineWidth=10; ctx.lineCap="round"; ctx.stroke();

  // Coloured arc segments
  const segHalf = deg2rad(SPAN_DEG/INDICATORS.length*0.42);
  INDICATORS.forEach((ind,i)=>{
    const s = getStatus(ind.key);
    if(s==="unknown") return;
    const mid = indAngle(i);
    ctx.beginPath(); ctx.arc(CX,CY,GAUGE_R, mid-segHalf, mid+segHalf);
    ctx.strokeStyle = s==="okay"?"#2dcf8a":"#ff4f4f";
    ctx.lineWidth=10; ctx.lineCap="butt"; ctx.stroke();
  });

  // Tick lines from arc out toward nodes
  INDICATORS.forEach((ind,i)=>{
    const ang = indAngle(i);
    const s   = getStatus(ind.key);
    const col = s==="okay"?"#2dcf8a":s==="faulted"?"#ff4f4f":"#2a2a2e";
    ctx.beginPath();
    ctx.moveTo(CX+(GAUGE_R+10)*Math.cos(ang), CY+(GAUGE_R+10)*Math.sin(ang));
    ctx.lineTo(CX+(NODE_R-36)*Math.cos(ang),  CY+(NODE_R-36)*Math.sin(ang));
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.lineCap="round"; ctx.stroke();
  });

  // Needles
  INDICATORS.forEach((ind,i)=>{
    const s=getStatus(ind.key); if(s==="unknown") return;
    const ang=indAngle(i);
    const col=s==="okay"?"#2dcf8a":"#ff4f4f";
    const nLen=GAUGE_R-20;
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.lineTo(CX+nLen*Math.cos(ang),CY+nLen*Math.sin(ang));
    ctx.strokeStyle=col+"44"; ctx.lineWidth=1.5; ctx.lineCap="round"; ctx.stroke();
    ctx.beginPath();
    ctx.arc(CX+(nLen-4)*Math.cos(ang),CY+(nLen-4)*Math.sin(ang),3.5,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill();
  });

  // Centre circle
  ctx.beginPath(); ctx.arc(CX,CY,72,0,Math.PI*2);
  ctx.fillStyle="#0e0e10"; ctx.fill();
  ctx.strokeStyle="#1e1e24"; ctx.lineWidth=1; ctx.stroke();

  // Centre text
  const nFault=SIGNALS.filter(s=>state[s]==="faulted").length;
  const nOk=SIGNALS.filter(s=>state[s]==="okay").length;
  const nUnk=SIGNALS.filter(s=>state[s]==="unknown").length;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font="bold 14px 'Courier New',monospace";
  if(nUnk===SIGNALS.length){
    ctx.fillStyle="#333"; ctx.fillText("WAITING",CX,CY);
  } else if(nFault>0){
    ctx.fillStyle="#ff4f4f"; ctx.fillText("FAULT",CX,CY-10);
    ctx.font="10px 'Courier New',monospace"; ctx.fillStyle="#ff4f4f77";
    ctx.fillText(nFault+" signal"+(nFault>1?"s":""),CX,CY+10);
  } else {
    ctx.fillStyle="#2dcf8a"; ctx.fillText("ALL OK",CX,CY-10);
    ctx.font="10px 'Courier New',monospace"; ctx.fillStyle="#2dcf8a77";
    ctx.fillText(nOk+" / "+SIGNALS.length,CX,CY+10);
  }

  // Centre pivot
  ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2); ctx.fillStyle="#333"; ctx.fill();
}

// ── Status helpers ────────────────────────────────────────────────
function getStatus(key){
  if(key==="TSSI"){
    const a=state["AMS_STATUS"],m=state["IMD_STATUS"];
    if(a==="unknown"||m==="unknown") return "unknown";
    return (a==="okay"&&m==="okay")?"okay":"faulted";
  }
  return state[key]||"unknown";
}

function refreshNode(key){
  const s    = getStatus(key);
  const node = document.getElementById("node-"+key);
  if(!node) return;
  node.className = "ind-node"+(s==="okay"?" ok":s==="faulted"?" fault":"");
}

function updateSignal(sig,status){
  state[sig]=status;
  refreshNode(sig);
  refreshNode("TSSI");
  drawGauge();
}

// ── Logging ───────────────────────────────────────────────────────
function addLog(msg,cls){
  const box=document.getElementById("log");
  const ts=new Date().toTimeString().slice(0,8);
  const d=document.createElement("div");
  d.className="log-line "+(cls||"");
  d.textContent=`[${ts}]  ${msg}`;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
  while(box.children.length>120) box.removeChild(box.firstChild);
}

// ── Parsing ───────────────────────────────────────────────────────
let pktCount=0;
function parseMsg(msg){
  const m=msg.match(/^(\w+_STATUS)\s+(okay|faulted)$/);
  if(m&&SIGNALS.includes(m[1])){
    updateSignal(m[1],m[2]);
    pktCount++;
    document.getElementById("pkt").textContent=pktCount+" pkts";
    addLog(msg,m[2]==="faulted"?"fault":"ok");
  }
}
function parseLine(line){
  line=line.trim();
  if(line.startsWith("Received")){const m=line.match(/\]: (.+)/);if(m)parseMsg(m[1].trim());}
  else if(line.startsWith("RSSI:")){document.getElementById("rssi").textContent="RSSI "+line.replace("RSSI:","").trim()+" dBm";}
  else if(/^\w+_STATUS\s+(okay|faulted)$/.test(line))parseMsg(line);
}

// ── Web Serial ────────────────────────────────────────────────────
let port=null,reader=null;
async function connectSerial(){
  if(!("serial" in navigator)){addLog("Web Serial not supported — use Chrome or Edge.","fault");return;}
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    const btn=document.getElementById("conn-btn");
    btn.textContent="Disconnect";btn.classList.add("live");btn.onclick=disconnectSerial;
    document.getElementById("dot").className="dot live";
    document.getElementById("cstat").textContent="connected";
    addLog("Serial port opened at 115200 baud.","sys");
    const dec=new TextDecoderStream();
    port.readable.pipeTo(dec.writable);
    reader=dec.readable.getReader();
    let buf="";
    (async()=>{
      try{
        while(true){
          const{value,done}=await reader.read();if(done)break;
          buf+=value;const lines=buf.split("\n");buf=lines.pop();
          lines.forEach(l=>{if(l.trim())parseLine(l);});
        }
      }catch(e){addLog("Read error: "+e.message,"fault");}
    })();
  }catch(e){addLog("Connect error: "+e.message,"fault");}
}
async function disconnectSerial(){
  if(reader){try{await reader.cancel();}catch(e){}reader=null;}
  if(port){try{await port.close();}catch(e){}port=null;}
  const btn=document.getElementById("conn-btn");
  btn.textContent="Connect serial";btn.classList.remove("live");btn.onclick=connectSerial;
  document.getElementById("dot").className="dot";
  document.getElementById("cstat").textContent="disconnected";
  addLog("Disconnected.","sys");
}

// ── Demo ──────────────────────────────────────────────────────────
let demoTimer=null,demoIdx=0;
const demoSeq=[
  "VSB_STATUS okay","CANWD_STATUS okay","RADIO_STATUS okay","IMD_STATUS okay","AMS_STATUS okay",
  "IMD_STATUS faulted","AMS_STATUS faulted","VSB_STATUS faulted",
  "IMD_STATUS okay","VSB_STATUS okay","AMS_STATUS okay",
  "CANWD_STATUS faulted","RADIO_STATUS faulted","CANWD_STATUS okay","RADIO_STATUS okay"
];
function toggleDemo(){
  const btn=document.getElementById("demo-btn");
  if(demoTimer){
    clearInterval(demoTimer);demoTimer=null;
    btn.classList.remove("live");
    document.getElementById("dot").className="dot";
    document.getElementById("cstat").textContent="disconnected";
    addLog("Demo stopped.","sys");return;
  }
  btn.classList.add("live");
  document.getElementById("dot").className="dot live";
  document.getElementById("cstat").textContent="demo";
  addLog("Demo mode active.","sys");
  demoTimer=setInterval(()=>{
    parseMsg(demoSeq[demoIdx%demoSeq.length]);
    document.getElementById("rssi").textContent="RSSI "+(-55-Math.floor(Math.random()*35))+" dBm";
    demoIdx++;
  },900);
}

// ── Init ──────────────────────────────────────────────────────────
buildNodes();
drawGauge();
addLog("Instrument cluster ready. Connect serial or run demo.","sys");
</script>
</body>
</html>
